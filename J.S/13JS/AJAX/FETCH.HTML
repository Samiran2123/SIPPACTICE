<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

</head>
<body>

    <ul>

    </ul>
    <script>
        const ull = document.querySelector('ul');
        async function getdata() {
            try{
                const response = await fetch('https://jsonplaceholder.typicode.com/users'); 
                // console.log(response);
                const data = await response.json();
                // console.log(data);
                // console.log(data[0].name);
                 data.forEach((ele)=>{

                     const list = document.createElement('li');
                     ull.appendChild(list);
                     list.innerHTML = `Name: ${ele.name} 
                                       Email: ${ele.id} 
                                       Body: ${ele.username}
                                       Email: ${ele.email}
                                       Address: ${ele.address}
                                       city: ${ele.address.city}`;
                list.style.marginBottom = '20px';
                                       list.style.listStyle = 'none';
                                       
                 })

            }catch{
               
            }
        }
        // getdata();


//get data by axios

        const ul = document.querySelector('ul');
        async function getdatabyAxios() {
            try{
                const response = await axios.get('https://jsonplaceholder.typicode.com/users'); 
                console.log(response);
                // const data = await response.json();
                // console.log(data);
                // console.log(data[0].name);
                 response.data.forEach((ele)=>{

                     const list = document.createElement('li');
                     
                     list.innerHTML = `Name: ${ele.name} <br>
                                       Email: ${ele.id} <br>
                                       Body: ${ele.username}<br>
                                       Email: ${ele.email}<br>
                                       Address: ${ele.address}<br>
                                       city: ${ele.address.city}`;
                                      list.style.marginBottom = '20px';
                                       list.style.listStyle = 'none';
                                       ul.appendChild(list);
                                       
                 })

            }catch(error){
               console.log(error);
            }
        }
        getdatabyAxios();
    </script>
</body>
</html>

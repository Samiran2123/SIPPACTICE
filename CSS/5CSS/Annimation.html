<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
*{
    background-color: black;
}
    .container{
        height: 79vh;
        width: 91vw;
        display: flex;
        justify-content: center;  
        align-items: center;  
        margin: 0px;
        /* animation: moveBox 1.3s ease-in-out infinite; */

    }
    .box{
        height: 60px;
        width: 60px;
        border-radius: 40px;
        border: 3px solid rgb(241, 235, 235);
        border-bottom-color: rgb(214, 63, 222);
        animation: moveBox 1.3s ease-in-out infinite;

        background-color: aqua;
        
    }
@keyframes moveBox{
    from{
        transform: rotate(0deg);
    }
    to{
        transform: rotate(360deg);
    }
    
}

</style>
<body>

    <div class="container">
        <div class="box"></div>
    </div>
</body>
</html>

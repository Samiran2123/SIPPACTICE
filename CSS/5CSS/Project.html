<body>
    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
      

        .container{
            height: 570px;
            display: grid;
            gap: 60px;
        }

        .items{
            border: 2px solid black;
            height: 100px;
            width: 100px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0px;
            transition-duration: 5s;
        }
        .container:hover .item1{
            transform: translateX(500px);
            transition-timing-function: ease;
        }
        .container:hover .item2{
            transform: translateX(500px);
            transition-timing-function: ease-in;
        }
         .container:hover .item3{
            transform: translateX(500px);
            transition-timing-function: ease-in-out;
        }
         .container:hover .item4{
            transform: translateX(500px);
            transition-timing-function: ease-out;
        }
         .container:hover .item5{
            transform: translateX(500px);
            transition-timing-function: linear;
        }
        .car4{
            height: 150px;
            width: 250px;
            display: flex;
        }
        .car3{
            height: 150px;
            width: 250px;
        }
       
    </style>
</head>
<body>
    <div class="container">
        <div class="track1">
            <div class="items item1"><img src="SIDE MUSTANG.jpeg" alt="" class="1"></div>
        </div>
        <div class="track2">
            <div class="items item2"><img src="challenger.jpeg" alt="" class="2"></div>
        </div>
        <div class="track3">
            <div class="items item3"><img src="ferrrari.jpeg" alt="" class="3"></div>
        </div>
        <div class="track4">
            <div class="items item4"><img src="2023-dodge-charger-srt-hellcat-last-call-king-daytona-5.jpg" alt="" class="car4"></div>
        </div>
        <div class="track5">
            <div class="items item5"><img src="paganizonda.jpeg" alt="" class="car5"></div>
        </div>
    </div>
</body>
</html>
</body>
</html>

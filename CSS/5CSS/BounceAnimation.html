<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
*{
    background-color: black;
}
    .container{
        height: 600px;
        width: 600px;
        display: flex;
        justify-content: center;  
        align-items: center;  
        margin: 0px;
        /* animation: moveBox 1.3s ease-in-out infinite; */

    }
    .box{
        height: 100px;
        width: 100px;
        border-radius: 100px;
        border: 3px solid rgb(241, 235, 235);
        border-bottom-color: rgb(214, 63, 222);
        animation: moveBox 0.5s ease-in-out infinite;

        background-color: aqua;
        
    }
@keyframes moveBox{
 0% {
    transform: translateX(100px);
 }
 50%{
    transform: translateY(-700px);
 }
 100%{
    transform: translateY(700);
 }
    
}

</style>
<body>

    <div class="container">
        <div class="box"></div>
    </div>
</body>
</html>

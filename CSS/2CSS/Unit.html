<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul
        {
        list-style: square;

        }
        ol
        {
            list-style: armenian;
        }
        .h
        {
            list-style: disc;
            font-size: 300%;
        }
        .hi
        {
            list-style: circle;
            font-size: 5em;
        }
        .k
        {
            list-style: square;
            font-size: 30mm;
        }
        .ka
        {
            list-style: none;
            font-size: 5cm;
        }

/* ol */
    .a
    {
        list-style: decimal;
        font-size: 2rem;
    }
    .j
    {
        list-style: upper-alpha;
        font-size: 20vw;
    }
    .ai
    {
        list-style: upper-roman;
        font-size: 10vh;
    }
    .hai
    {
        list-style: lower-greek;
    }

    .kay
    {
        list-style: upper-roman;
        font-size: 30px;
    }
    </style>
</head>
<body>
    <div>
        <ul>
            <li class="h">hello</li>
            <li class="hi">hiii</li>
            <li class="k">kaya</li>
            <li class="ka">kar</li>
            <li class="r">rahe</li>
            <li class="ho">ho</li>
        </ul>
    </div>
    <div>
        <ol>
            <li class="a">accha</li>
            <li class="j">jiii</li>
            <li class="ai">aisa</li>
            <li class="hai">hai</li>
            <li class="kay">kaya</li>
            
        </ol>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* display: block */
        button{
            display: block;
        }
        /* display: inline */
        div{
            border: 1px solid black;
            margin: 7px;
            display: inline;
        }
        /* display: inline block */
        .hwy{
            display: inline-block;
            height: 200px;
            width: 200px;
            padding: 8px;
            border :30px rosybrown solid;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hwy:hover{
            background-color: aqua;
        }
        .hwy:active{
            background-color: rgb(90, 191, 225);
        }
        /* display: none */
        .dn{
            display: none;
        }

    </style>
</head>
<body>
    <!-- display: block -->
    <BUtton>1</BUtton>
    <BUtton>2</BUtton>
    <BUtton>3</BUtton>
    <!-- display: inline -->
    <div>1</div>
    <div>2</div>
    <div>3</div>


    <!-- display: inline block -->
    
        <li>a</li>
        <li>b</li>
        <li>c</li>
<span class="hwy">Gabber</span>

<!-- display: none -->
<p class="dn">Lorem ipsum dolor sit amet consectetur adipisicing elit. Vitae, magni! Nostrum minus labore, et praesentium saepe quidem possimus quasi eligendi incidunt a. Provident qui quisquam ipsa dolorum. Rerum, soluta unde!</p>

</body>
</html>
